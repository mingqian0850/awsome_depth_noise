name: daily-literature-search

on:
  schedule:
    # Daily at 02:17 UTC — after arXiv's daily announcements (~00:00 UTC).
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback days for this manual run"
        required: false
        default: "3"
        type: string

permissions:
  contents: write

concurrency:
  group: daily-literature-search
  cancel-in-progress: true

jobs:
  search-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Multi-source digest: arXiv RSS (full daily feed + local keyword filter)
      # and OpenAlex (keyword queries). A non-zero exit code means the search
      # itself failed — the job turns red instead of silently reporting zero.
      - name: Run daily literature search
        run: |
          if [ -n "${{ inputs.days }}" ]; then
            python scripts/daily_search.py --days "${{ inputs.days }}"
          else
            python scripts/daily_search.py
          fi

      - name: Show source health
        if: always()
        run: |
          if [ -f daily_updates/.health.json ]; then
            echo "=== daily_updates/.health.json (last entry) ==="
            python -c "import json;h=json.load(open('daily_updates/.health.json'));print(json.dumps(h[-1],ensure_ascii=False,indent=1))"
          else
            echo "No health record yet."
          fi

      - name: Show latest digest (for log visibility)
        if: always()
        run: |
          latest=$(ls -1 daily_updates/20*.md 2>/dev/null | tail -n 1 || true)
          if [ -n "$latest" ]; then
            echo "=== $latest ==="
            cat "$latest"
          else
            echo "No digest files yet."
          fi

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit (no new candidates found)."
          else
            git commit -m "chore(daily): auto-update literature digest $(date -u +%F)"
            git push
          fi
